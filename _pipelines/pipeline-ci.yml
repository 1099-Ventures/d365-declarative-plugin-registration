# Build, test and publish Ten99.D365.PluginRegistration and Ten99.D365.PluginRegistration.Tool.
#
# Runs in Azure DevOps (1099Ventures) against this GitHub repository.
#   Pull requests and main:  build and test, and pack as a build artifact.
#   Tags v<semver>:          also push both packages to nuget.org, versioned from the tag
#                            (v0.1.0-alpha.1 publishes 0.1.0-alpha.1).
#
# Prerequisites:
#   - A GitHub service connection (GitHub App) for this repository, so PR builds report back to GitHub.
#   - Secret pipeline variable NuGetApiKey: a nuget.org API key scoped to push Ten99.*.

trigger:
  branches:
    include:
      - main
  tags:
    include:
      - v*
  paths:
    exclude:
      - '**/*.md'
      - LICENSE
      - .gitignore

pr:
  branches:
    include:
      - main
  paths:
    exclude:
      - '**/*.md'
      - LICENSE
      - .gitignore

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  isRelease: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/v') }}

stages:
  - stage: Build
    jobs:
      - job: Build
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK from global.json'
            inputs:
              packageType: 'sdk'
              useGlobalJson: true

          - bash: |
              set -euo pipefail
              if [ "$(isRelease)" = "True" ]; then
                version="${BUILD_SOURCEBRANCH#refs/tags/v}"
                if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                  echo "##vso[task.logissue type=error]Tag v$version is not a semantic version."
                  exit 1
                fi
                echo "Release version $version"
                echo "##vso[task.setvariable variable=versionArgument]-p:Version=$version"
                echo "##vso[build.updatebuildnumber]$version"
              else
                # Not a release: the version from Directory.Build.props, marked with the build id
                echo "##vso[task.setvariable variable=versionArgument]-p:VersionSuffix=ci.$(Build.BuildId)"
              fi
            displayName: 'Set version'

          - script: dotnet build -c $(buildConfiguration) $(versionArgument) -nologo
            displayName: 'Build'

          - script: dotnet test -c $(buildConfiguration) --no-build
            displayName: 'Test'

          - script: dotnet pack -c $(buildConfiguration) --no-build $(versionArgument) -o $(Build.ArtifactStagingDirectory)/packages -nologo
            displayName: 'Pack'

          - publish: $(Build.ArtifactStagingDirectory)/packages
            artifact: packages
            displayName: 'Publish packages artifact'

  - stage: Publish
    dependsOn: Build
    condition: and(succeeded(), eq(variables['isRelease'], 'True'))
    jobs:
      - job: Publish
        steps:
          - checkout: none

          - download: current
            artifact: packages

          - task: UseDotNet@2
            displayName: 'Install .NET 10 SDK'
            inputs:
              packageType: 'sdk'
              version: '10.x'

          - bash: |
              set -euo pipefail
              if [ -z "${NUGET_API_KEY:-}" ]; then
                echo "##vso[task.logissue type=error]Secret variable NuGetApiKey is not set."
                exit 1
              fi
              for package in "$(Pipeline.Workspace)"/packages/*.nupkg; do
                dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
              done
            displayName: 'Push to nuget.org'
            env:
              NUGET_API_KEY: $(NuGetApiKey)
